<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Grieve Ancestry</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5rem;
            letter-spacing: 1px;
        }

        .photo-gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .gallery-item {
            flex: 1 1 300px;
            max-width: 350px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
            background-color: #111111;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <h1>The Grieve Ancestry</h1>

    <div class="photo-gallery">
        <div class="gallery-item">
            <img src="cake.png" alt="Birthday Cake">
        </div>
        <div class="gallery-item">
            <img src="gorilla.png" alt="Safari Park Gorilla Statue">
        </div>
        <div class="gallery-item">
            <img src="swings.png" alt="Swings at Night">
        </div>
    </div>

</body>
</html>
